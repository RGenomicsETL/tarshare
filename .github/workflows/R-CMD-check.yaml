name: R-CMD-check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
      - name: Verify generated public help
        shell: Rscript {0}
        run: |
          roxygen2::roxygenise()
          status <- system2("git", c("diff", "--exit-code", "--", "NAMESPACE", "man"))
          untracked <- system2("git", c("ls-files", "--others", "--exclude-standard", "man"), stdout = TRUE)
          stopifnot(status == 0L, length(untracked) == 0L)
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
      - name: Retain executed source and check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.os }}
          path: check/
          retention-days: 14
          if-no-files-found: warn
